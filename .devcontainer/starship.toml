# NorthLight Starship configuration

add_newline = true
command_timeout = 1000

format = """
$custom$directory$git_branch$git_status$python$cmd_duration$status$character
"""

[custom.northlight]
command = "printf '🛰️'"
when = "true"
format = "[$output ](bold cyan)"

[directory]
format = "[📁 $path](bold blue) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
format = "[$symbol$branch](bold purple) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"

conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "-${count}"

[python]
symbol = "🐍 "
format = "[$symbol$version](bold green) "

[cmd_duration]
min_time = 1000
format = "[${duration}](bold yellow) "

[status]
disabled = false
format = "[✗$status](bold red) "

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold green)"