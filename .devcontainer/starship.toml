# NorthLight Starship configuration

add_newline = false
command_timeout = 1000

format = "$custom$os$directory$git_branch$git_status$python$cmd_duration$status\n$character"

[custom.northlight]
command = "printf 'NorthLight Space Systems™'"
symbol = "🛰️ "
when = "true"
format = "[$symbol $output](bold cyan) "

[os]
format = "on [($name )]($style)"
style = "bold yellow"
disabled = false

[directory]
format = "[📁 $path](bold blue) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "🌿 "
format = "[$symbol$branch](bold purple) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"

conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "-${count}"

[python]
symbol = "🐍 "
format = "[$symbol$version](bold green) "

[cmd_duration]
min_time = 1000
format = "[${duration}](bold yellow) "

[status]
disabled = false
format = "[✗$status](bold red) "

[character]
success_symbol = "[>](bold green) "
error_symbol = "[>](bold red) "
vimcmd_symbol = "[<](bold green) "
