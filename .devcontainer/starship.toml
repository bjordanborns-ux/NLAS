# NorthLight Starship configuration

add_newline = true
command_timeout = 1000

format = """
[╭─](bold blue)\
$custom\
$directory\
$git_branch\
$git_status\
$python\
$cmd_duration\
$status
[╰─](bold blue)$character
"""

[custom.northlight]
command = "printf 'NORTHLIGHT'"
when = "true"
format = "[🛰️ $output](bold cyan) "

[directory]
format = "[📁 $path](bold blue) "
truncation_length = 3
truncate_to_repo = true
read_only = " 🔒"

[directory.substitutions]
"workspaces" = "MISSION"
"NLAS" = "NORTHLIGHT"
"northlight-mission-ops-system" = "NORTHLIGHT"

[git_branch]
symbol = "🌿 "
format = "on [$symbol$branch](bold purple) "

[git_status]
format = "([$all_status$ahead_behind](bold yellow) )"
conflicted = "⚠️ ${count} "
ahead = "⬆️ ${count} "
behind = "⬇️ ${count} "
diverged = "↕️ ${ahead_count}/${behind_count} "
untracked = "📡 ${count} "
stashed = "📦 ${count} "
modified = "🛠️ ${count} "
staged = "✅ ${count} "
renamed = "🚚 ${count} "
deleted = "🗑️ ${count} "

[python]
symbol = "🐍 "
format = "via [$symbol$version](bold green) "
python_binary = ["python", "python3"]

[cmd_duration]
min_time = 1000
format = "took [⏱️ $duration](bold yellow) "

[status]
disabled = false
format = "[$symbol$status](bold red) "
symbol = "❌ "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"